<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄道スタフ作成ツール</title>
    <style>
        body {
            font-family: monospace;
            background: #f0f0f0;
            padding: 20px;
        }
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            text-align: center;
            width: 320px;
            position: relative;
            border: 2px solid #000;
        }
        .auth-box input {
            width: 80%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        .auth-admin-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border: 2px solid #000;
            width: 480px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
        }
        .train-form {
            border: 1px dashed #666;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .station-row {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
            align-items: center;
            font-size: 12px;
        }
        .station-row input {
            padding: 3px;
        }
        .station-row input.name { width: 75px; }
        .station-row input.time { width: 50px; text-align: center; }
        .station-row input.hnd { width: 45px; text-align: center; }
        .station-row input.trk { width: 45px; text-align: center; }
        
        .staff-cards-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .staff-card {
            background: white;
            border: 2px solid #000;
            width: 300px;
            padding: 10px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
        }
        .staff-header, .staff-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            margin-bottom: 5px;
        }
        .staff-header td, .staff-table th, .staff-table td {
            border: 1px solid #000;
            padding: 4px;
            font-size: 13px;
            text-align: center;
        }
        .staff-table th {
            background: #e0e0e0;
        }
        button {
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 8888;
        }
        .modal-content {
            background: white;
            padding: 20px;
            width: 550px;
            border: 2px solid #000;
            max-height: 85vh;
            overflow-y: auto;
        }
        #autogen-screen {
            display: none;
            background: white;
            padding: 20px;
            border: 2px solid #000;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .gen-section-card {
            background: #fff;
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <button class="auth-admin-btn" onclick="openAdminModalFromAuth()">管理者パネル</button>

            <h3>パスワード認証</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">社員用パスワードを入力してください</p>
            <input type="password" id="pass-input" placeholder="6桁のパスワード" maxlength="6">
            <br>
            <button onclick="checkPassword()" style="background: #4CAF50; color: white; width: 85%; padding: 8px; border:none; border-radius:3px;">ログイン</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3>管理者パネル</h3>
            <h4 style="margin-bottom:5px;">🌐 アクセス情報</h4>
            <div id="ip-info-box" style="background:#eee; padding:8px; font-size:12px; margin-bottom:15px; border:1px solid #ccc;">取得中...</div>
            <h4 style="margin-bottom:5px;">📋 社員用パスワード管理</h4>
            <div id="password-list-container" style="margin-bottom: 10px; max-height:150px; overflow-y:auto;"></div>
            <div style="margin-bottom: 15px; background: #fafafa; padding: 8px; border: 1px dashed #999;">
                <input type="text" id="new-name-input" placeholder="社員名" style="width: 45%; padding: 4px;">
                <input type="text" id="new-pass-input" placeholder="6桁パス" maxlength="6" style="width: 45%; padding: 4px;">
                <br><button onclick="addPassword()" style="background: #2196F3; color: white; width: 100%; margin-top:5px; font-size:12px;">追加</button>
            </div>
            <h4 style="margin-bottom:5px;">📁 操作履歴</h4>
            <div id="staff-history-container" style="background:#fefefe; padding:8px; font-size:11px; max-height:120px; overflow-y:auto; border:1px solid #ccc; margin-bottom: 15px;">履歴なし</div>
            <button onclick="closeAdminModal()" style="width: 100%; background: #ccc; padding: 6px;">閉じる</button>
        </div>
    </div>

    <div class="top-bar">
        <div>
            <h2>鉄道スタフ作成ツール <span id="login-user-name" style="color:#2196F3; font-size:14px; font-weight:normal; margin-left:10px;"></span></h2>
        </div>
        <div style="display: flex; gap: 5px; align-items: center;">
            <button id="nav-autogen-btn" onclick="toggleAutoGenScreen()" style="background:#ff9800; color:white;">ダイヤ自動作成</button>
            <button onclick="logout()" style="background: #f44336; color: white;">ログアウト</button>
        </div>
    </div>

    <!-- ダイヤ自動作成画面 -->
    <div id="autogen-screen">
        <h3>ダイヤ自動作成・路線設定</h3>
        <p style="font-size:12px; color:#666;">条件を設定し、Web計算によるダイヤ作成を実行できます（最大50駅対応）。</p>

        <div style="background:#fafafa; padding:10px; border:1px solid #ccc; margin-bottom:15px;">
            <h4 style="margin:0 0 5px 0;">基本運行条件・編成・退避</h4>
            <label style="font-size:12px;">種別一覧 (普通, 快速, 特急など):</label><br>
            <textarea id="gen-types" style="width:100%; height:35px; font-family:monospace;">普通, 快速, 特急</textarea><br>
            
            <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; align-items:center;">
                <div><label style="font-size:12px;">開始時刻:</label><br><input type="text" id="gen-start-time" value="06:00" style="width:80px;"></div>
                <div><label style="font-size:12px;">終了時刻:</label><br><input type="text" id="gen-end-time" value="23:00" style="width:80px;"></div>
                <div><label style="font-size:12px;">作成編成数:</label><br><input type="number" id="gen-train-count" value="3" min="1" max="50" style="width:70px;"></div>
                <div>
                    <label style="font-size:12px;">退避設定:</label><br>
                    <select id="gen-overtaking" style="padding:3px;">
                        <option value="none">退避なし</option>
                        <option value="auto">主要駅で自動退避 (運転停車)</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="background:#fafafa; padding:10px; border:1px solid #ccc; margin-bottom:15px;">
            <h4 style="margin:0 0 5px 0;">区間・駅構造データ</h4>
            <div id="gen-stations-container"></div>
            <button onclick="addGenStationRow()" style="background:#ddd; font-size:11px; margin-top:5px;">＋ 駅を追加</button>
            <button onclick="removeGenStationRow()" style="background:#ff9999; font-size:11px; margin-top:5px; margin-left:5px;">✕ 駅を削除</button>
        </div>

        <div style="margin-bottom: 15px; background: #e8f4fd; padding: 10px; border: 1px solid #bbe2ff; font-size:12px;">
            <b>データ一括保存・読込:</b>
            <button onclick="saveGenSettings()" style="background:#4CAF50; color:white; font-size:11px; margin-left:10px; padding:5px 10px;">全部保存</button>
            <label style="cursor:pointer; background:#607D8B; color:white; padding:5px 10px; font-size:11px; display:inline-block; margin-left:5px; font-weight:bold;">
                全部読み込み
                <input type="file" accept=".json" style="display:none;" onchange="loadGenSettings(event)">
            </label>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
            <button onclick="executeAutoGenerate()" style="background:#2196F3; color:white; padding:10px 20px; font-size:14px;">🧮 ダイヤ作成（Web計算実行）</button>
            <button onclick="toggleAutoGenScreen()" style="background: #ccc; padding: 10px 15px;">スタフ編集画面に戻る</button>
        </div>
    </div>

    <!-- 通常のファイル操作・編集画面 -->
    <div id="main-editor-area">
        <div style="margin-bottom: 15px; background: #ddd; padding: 10px; border: 1px solid #999;">
            <b>ファイル操作:</b>
            <button onclick="saveToFile()" style="background: #4CAF50; color: white; margin-left: 10px; font-size: 14px; padding: 6px 12px;">💾 スタフをすべて保存</button>
            <label style="margin-left: 10px; cursor: pointer; background: #607D8B; color: white; padding: 6px 12px; display: inline-block; font-weight: bold; font-size: 14px;">
                📂 スタフ/Oudia読み込み (.json/.oud)
                <input type="file" id="file-loader" accept=".json,.oud" style="display: none;" onchange="loadFromFile(event)">
            </label>
        </div>

        <div class="container">
            <div class="control-panel">
                <h3>ダイヤ・スタフ編集 (無限追加可能)</h3>
                <button onclick="addTrain()" style="background: #4CAF50; color: white; width: 100%; margin-bottom: 15px; padding: 8px;">＋ 新しい列車を追加</button>
                
                <div id="trains-input-container"></div>
            </div>

            <div class="staff-cards-area" id="staff-preview-container"></div>
        </div>
    </div>

    <script>
        let initialPasswords = [
            { name: "スタッフ01", pass: "834912" },
            { name: "スタッフ02", pass: "512064" },
            { name: "スタッフ03", pass: "948301" },
            { name: "スタッフ04", pass: "275619" },
            { name: "スタッフ05", pass: "630482" },
            { name: "スタッフ06", pass: "192547" },
            { name: "スタッフ07", pass: "481035" },
            { name: "スタッフ08", pass: "709283" },
            { name: "スタッフ09", pass: "356190" },
            { name: "スタッフ10", pass: "824716" },
            { name: "スタッフ11", pass: "503924" },
            { name: "スタッフ12", pass: "168430" },
            { name: "スタッフ13", pass: "912657" },
            { name: "スタッフ14", pass: "247081" },
            { name: "スタッフ15", pass: "685193" },
            { name: "スタッフ16", pass: "309462" },
            { name: "スタッフ17", pass: "741528" },
            { name: "スタッフ18", pass: "528091" },
            { name: "スタッフ19", pass: "193465" },
            { name: "管理者メイン", pass: "860247" }
        ];

        let allowedPasswords = JSON.parse(localStorage.getItem('allowedPasswords')) || initialPasswords;
        let staffHistory = JSON.parse(localStorage.getItem('staffHistory')) || [];
        let trainsData = JSON.parse(localStorage.getItem('trainsData')) || [];

        let clientIp = "取得中...";
        let currentLoggedInUser = "";
        let isAutoGenView = false;

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { clientIp = data.ip; })
            .catch(() => { clientIp = "ローカル"; });

        function checkPassword() {
            let val = document.getElementById('pass-input').value.trim();
            let matched = allowedPasswords.find(item => item.pass === val);
            if (matched) {
                currentLoggedInUser = matched.name;
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';
                recordHistory(`ログイン成功 (${currentLoggedInUser})`);
            } else {
                document.getElementById('auth-error').innerText = 'パスワードが違います';
            }
        }

        function logout() {
            recordHistory(`ログアウト (${currentLoggedInUser})`);
            document.getElementById('pass-input').value = '';
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function openAdminModalFromAuth() {
            let p = prompt("管理者用パスワードを入力してください");
            if (p === "1289") {
                currentLoggedInUser = "管理者";
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';
                renderAdminData();
                document.getElementById('admin-modal').style.display = 'flex';
            } else if (p !== null) {
                alert("パスワードが違います");
            }
        }
        function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }

        function toggleAutoGenScreen() {
            isAutoGenView = !isAutoGenView;
            let autogenScreen = document.getElementById('autogen-screen');
            let mainEditor = document.getElementById('main-editor-area');
            let btn = document.getElementById('nav-autogen-btn');

            if (isAutoGenView) {
                autogenScreen.style.display = 'block';
                mainEditor.style.display = 'none';
                btn.innerText = 'スタフ編集に戻る';
                btn.style.background = '#607D8B';
                initGenStations();
            } else {
                autogenScreen.style.display = 'none';
                mainEditor.style.display = 'block';
                btn.innerText = 'ダイヤ自動作成';
                btn.style.background = '#ff9800';
            }
        }

        let genStations = JSON.parse(localStorage.getItem('genStations')) || [
            { stationA: "A駅", faceA: "2", trackA: "2", sec: "60", stationB: "B駅", faceB: "2", trackB: "2", type: "複線" }
        ];

        function initGenStations() {
            let container = document.getElementById('gen-stations-container');
            container.innerHTML = '';
            genStations.forEach((s, idx) => {
                container.innerHTML += `
                    <div class="gen-section-card">
                        <div style="display:flex; align-items:center; gap:5px; margin-bottom:6px; flex-wrap:wrap;">
                            <input type="text" value="${s.stationA}" oninput="genStations[${idx}].stationA=this.value" style="width:75px; text-align:center;" placeholder="A駅">
                            <span>〜</span>
                            <input type="text" value="${s.stationB}" oninput="genStations[${idx}].stationB=this.value" style="width:75px; text-align:center;" placeholder="B駅">
                        </div>
                        <div style="display:flex; align-items:center; gap:5px; margin-bottom:6px; flex-wrap:wrap;">
                            <div><input type="text" value="${s.faceA}" oninput="genStations[${idx}].faceA=this.value" style="width:25px; text-align:center;">面<input type="text" value="${s.trackA}" oninput="genStations[${idx}].trackA=this.value" style="width:25px; text-align:center;">線</div>
                            <span style="font-weight:bold;">[<input type="text" value="${s.sec}" oninput="genStations[${idx}].sec=this.value" style="width:35px; text-align:center;">秒]</span>
                            <div><input type="text" value="${s.faceB}" oninput="genStations[${idx}].faceB=this.value" style="width:25px; text-align:center;">面<input type="text" value="${s.trackB}" oninput="genStations[${idx}].trackB=this.value" style="width:25px; text-align:center;">線</div>
                        </div>
                        <div>
                            線路形態: 
                            <select oninput="genStations[${idx}].type=this.value">
                                <option ${s.type==='単線'?'selected':''}>単線</option>
                                <option ${s.type==='複線'?'selected':''}>複線</option>
                                <option ${s.type==='複々線'?'selected':''}>複々線</option>
                            </select>
                        </div>
                    </div>
                `;
            });
        }

        function addGenStationRow() {
            if (genStations.length >= 50) {
                alert("最大50駅まで追加可能です。");
                return;
            }
            genStations.push({ stationA: "駅", faceA: "2", trackA: "2", sec: "60", stationB: "駅", faceB: "2", trackB: "2", type: "複線" });
            initGenStations();
        }
        function removeGenStationRow() {
            genStations.pop();
            initGenStations();
        }

        function saveGenSettings() {
            let settingObj = {
                types: document.getElementById('gen-types').value,
                startTime: document.getElementById('gen-start-time').value,
                endTime: document.getElementById('gen-end-time').value,
                stations: genStations
            };
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(settingObj, null, 2));
            let d = document.createElement('a');
            d.setAttribute("href", dataStr);
            d.setAttribute("download", "autogen_settings.json");
            d.click();
        }

        function loadGenSettings(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let obj = JSON.parse(e.target.result);
                    document.getElementById('gen-types').value = obj.types || "";
                    document.getElementById('gen-start-time').value = obj.startTime || "06:00";
                    document.getElementById('gen-end-time').value = obj.endTime || "23:00";
                    genStations = obj.stations || genStations;
                    initGenStations();
                    alert("設定を読み込みました！");
                } catch(err) { alert("読込失敗"); }
            };
            reader.readAsText(file);
        }

        // Web計算によるダイヤ自動作成関数
        function executeAutoGenerate() {
            let trainCount = parseInt(document.getElementById('gen-train-count').value) || 1;
            let overtaking = document.getElementById('gen-overtaking').value;
            let startTimeStr = document.getElementById('gen-start-time').value || "06:00";
            let typesList = document.getElementById('gen-types').value.split(',').map(s => s.trim()).filter(Boolean);
            if (typesList.length === 0) typesList = ["普通"];

            let [baseHour, baseMinute] = startTimeStr.split(':').map(Number);
            let baseTotalMin = baseHour * 60 + baseMinute;

            trainsData = []; // 新規生成

            for (let t = 0; t < trainCount; t++) {
                let stationsList = [];
                let currentMin = baseTotalMin + (t * 12); // 12分間隔で発車
                let trainType = typesList[t % typesList.length];

                genStations.forEach((gs, i) => {
                    let secNum = parseInt(gs.sec) || 60;
                    let addMin = Math.ceil(secNum / 60);

                    if (i === 0) {
                        let h = Math.floor(currentMin / 60) % 24;
                        let m = currentMin % 60;
                        let depStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                        stationsList.push({ name: gs.stationA, arr: "", dep: depStr, handle: "停車", track: gs.trackA });
                    }

                    currentMin += addMin;
                    let h = Math.floor(currentMin / 60) % 24;
                    let m = currentMin % 60;
                    let timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

                    let handleVal = "停車";
                    if (overtaking === "auto" && i > 0 && i < genStations.length - 1 && i % 2 === 1 && t % 2 === 1) {
                        handleVal = "運転停車";
                        currentMin += 2; // 運転停車で2分プラス
                    }

                    stationsList.push({ name: gs.stationB, arr: timeStr, dep: timeStr, handle: handleVal, track: gs.trackB });
                });

                trainsData.push({
                    num: `${trainType.charAt(0)}${101 + t}`,
                    stations: stationsList
                });
            }

            render();
            toggleAutoGenScreen();
            alert(`Web計算完了！ ${trainCount}本分のダイヤを自動作成しました。`);
        }

        function recordHistory(action) {
            let now = new Date().toLocaleString();
            staffHistory.unshift(`[${now}] ${currentLoggedInUser} - ${action}`);
            if (staffHistory.length > 20) staffHistory.pop();
            localStorage.setItem('staffHistory', JSON.stringify(staffHistory));
        }

        function renderAdminData() {
            document.getElementById('ip-info-box').innerHTML = `IP: <b>${clientIp}</b>`;
            let c = document.getElementById('password-list-container');
            c.innerHTML = allowedPasswords.map((item) => `<div style="font-size:11px; margin-bottom:2px;">[${item.name}] パス: ${item.pass}</div>`).join('');
            document.getElementById('staff-history-container').innerHTML = staffHistory.join('<br>') || '履歴なし';
        }

        function addPassword() {
            let name = document.getElementById('new-name-input').value.trim();
            let pass = document.getElementById('new-pass-input').value.trim();
            if(!name || !pass) return;
            allowedPasswords.push({name, pass});
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            renderAdminData();
        }

        function saveToFile() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trainsData, null, 2));
            let d = document.createElement('a');
            d.setAttribute("href", dataStr);
            d.setAttribute("download", "all_staff_data.json");
            d.click();
        }

        function loadFromFile(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    trainsData = JSON.parse(e.target.result);
                    render();
                    alert("読み込み成功！");
                } catch(err) { alert("読込失敗"); }
            };
            reader.readAsText(file);
        }

        function updateTrainNum(tIndex, val) { trainsData[tIndex].num = val; localStorage.setItem('trainsData', JSON.stringify(trainsData)); updatePreview(); }

        function updateData(tIndex, sIndex, field, val) {
            let st = trainsData[tIndex].stations[sIndex];
            st[field] = val;
            if (field === 'handle' && val === '通過') {
                st.arr = 'レ'; st.dep = 'レ';
                let a = document.getElementById(`arr_${tIndex}_${sIndex}`);
                let dp = document.getElementById(`dep_${tIndex}_${sIndex}`);
                if(a) a.value = 'レ'; if(dp) dp.value = 'レ';
            }
            localStorage.setItem('trainsData', JSON.stringify(trainsData));
            updatePreview();
        }

        function updatePreview() {
            const previewContainer = document.getElementById('staff-preview-container');
            previewContainer.innerHTML = '';
            trainsData.forEach((train) => {
                let rows = train.stations.map(st => `
                    <tr>
                        <td>${st.name}</td>
                        <td>${st.arr || '-'}</td>
                        <td>${st.dep || '-'}</td>
                        <td>${st.handle}</td>
                        <td>${st.track}</td>
                    </tr>
                `).join('');
                previewContainer.innerHTML += `
                    <div class="staff-card">
                        <table class="staff-header"><tr><td style="font-weight:bold;">${train.num}</td></tr></table>
                        <table class="staff-table"><tr><th>駅名</th><th>到着</th><th>出発</th><th>扱い</th><th>番線</th></tr>${rows}</table>
                    </div>
                `;
            });
        }

        function render() {
            localStorage.setItem('trainsData', JSON.stringify(trainsData));
            let container = document.getElementById('trains-input-container');
            container.innerHTML = '';
            trainsData.forEach((train, tIndex) => {
                let stHtml = train.stations.map((st, sIndex) => `
                    <div class="station-row">
                        <input type="text" class="name" placeholder="駅名" value="${st.name}" oninput="updateData(${tIndex}, ${sIndex}, 'name', this.value)">
                        <input type="text" id="arr_${tIndex}_${sIndex}" class="time" placeholder="着" value="${st.arr}" oninput="updateData(${tIndex}, ${sIndex}, 'arr', this.value)">
                        <input type="text" id="dep_${tIndex}_${sIndex}" class="time" placeholder="発" value="${st.dep}" oninput="updateData(${tIndex}, ${sIndex}, 'dep', this.value)">
                        <input type="text" class="hnd" placeholder="扱" value="${st.handle}" oninput="updateData(${tIndex}, ${sIndex}, 'handle', this.value)">
                        <input type="text" class="trk" placeholder="番線" value="${st.track}" oninput="updateData(${tIndex}, ${sIndex}, 'track', this.value)">
                        <button onclick="removeStation(${tIndex}, ${sIndex})" style="background:#ff9999; border:none; padding:2px 4px; font-size:10px;">✕</button>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="train-form">
                        <h4>列車 ${tIndex + 1}</h4>
                        <div style="margin-bottom: 5px; font-size:12px;">列車番号: <input type="text" value="${train.num}" style="width:120px;" oninput="updateTrainNum(${tIndex}, this.value)"></div>
                        ${stHtml}
                        <button onclick="addStation(${tIndex})" style="background:#ddd; font-size:11px;">＋ 駅を追加</button>
                        <button onclick="removeTrain(${tIndex})" style="background:#ff6666; color:white; float:right; font-size:11px;">列車を削除</button>
                        <div style="clear:both;"></div>
                    </div>
                `;
            });
            updatePreview();
        }

        function addTrain() { trainsData.push({num: "", stations: []}); render(); }
        function removeTrain(i) { trainsData.splice(i, 1); render(); }
        function addStation(t) { trainsData[t].stations.push({name:"", arr:"", dep:"", handle:"", track:""}); render(); }
        function removeStation(t, s) { trainsData[t].stations.splice(s, 1); render(); }

        render();
    </script>
</body>
</html>
