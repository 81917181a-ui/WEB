<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">鉄道スタフ作成ツール</title>
    <style>
        body {
            font-family: monospace;
            background: #f0f0f0;
            padding: 20px;
        }
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            text-align: center;
            width: 320px;
            position: relative;
            border: 2px solid #000;
        }
        .auth-box input {
            width: 80%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        .auth-admin-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border: 2px solid #000;
            width: 480px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
        }
        .train-form {
            border: 1px dashed #666;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .station-row {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
            align-items: center;
            font-size: 12px;
        }
        .station-row input {
            padding: 3px;
        }
        .station-row input.name { width: 75px; }
        .station-row input.time { width: 50px; text-align: center; }
        .station-row input.hnd { width: 45px; text-align: center; }
        .station-row input.trk { width: 45px; text-align: center; }
        
        .staff-cards-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .staff-card {
            background: white;
            border: 2px solid #000;
            width: 300px;
            padding: 10px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
        }
        .staff-header, .staff-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            margin-bottom: 5px;
        }
        .staff-header td, .staff-table th, .staff-table td {
            border: 1px solid #000;
            padding: 4px;
            font-size: 13px;
            text-align: center;
        }
        .staff-table th {
            background: #e0e0e0;
        }
        button {
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 8888;
        }
        .modal-content {
            background: white;
            padding: 20px;
            width: 500px;
            border: 2px solid #000;
            max-height: 85vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <button class="auth-admin-btn" onclick="openAdminModalFromAuth()">管理者パネル</button>

            <h3>パスワード認証</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">社員用パスワードを入力してください</p>
            <input type="password" id="pass-input" placeholder="6桁のパスワード" maxlength="6">
            <br>
            <button onclick="checkPassword()" style="background: #4CAF50; color: white; width: 85%; padding: 8px; border:none; border-radius:3px;">ログイン</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3>管理者パネル</h3>
            
            <h4 style="margin-bottom:5px;">🌐 機械側で特定したアクセス情報</h4>
            <div id="ip-info-box" style="background:#eee; padding:8px; font-size:12px; margin-bottom:15px; border:1px solid #ccc;">
                自動取得中...
            </div>

            <h4 style="margin-bottom:5px;">📋 社員用パスワード管理</h4>
            <div id="password-list-container" style="margin-bottom: 10px;"></div>
            <div style="margin-bottom: 15px; background: #fafafa; padding: 8px; border: 1px dashed #999;">
                <input type="text" id="new-name-input" placeholder="社員名/ニックネーム" style="width: 45%; padding: 4px; margin-bottom: 4px;">
                <input type="text" id="new-pass-input" placeholder="6桁のパスワード" maxlength="6" style="width: 45%; padding: 4px; margin-bottom: 4px;">
                <br>
                <button onclick="addPassword()" style="background: #2196F3; color: white; width: 100%; padding: 5px; font-size:12px;">社員用パスワードを追加</button>
            </div>

            <h4 style="margin-bottom:5px;">📁 操作履歴・アクセスログ</h4>
            <div id="staff-history-container" style="background:#fefefe; padding:8px; font-size:11px; max-height:160px; overflow-y:auto; border:1px solid #ccc; margin-bottom: 15px;">
                履歴はありません
            </div>
            
            <button onclick="closeAdminModal()" style="width: 100%; background: #ccc; padding: 6px;">閉じる</button>
        </div>
    </div>

    <div class="top-bar">
        <div>
            <h2 id="app-title-display" style="display:inline; margin:0;">鉄道スタフ作成ツール</h2>
            <span id="login-user-name" style="color:#2196F3; font-size:14px; margin-left:10px;"></span>
        </div>
        <div style="display: flex; gap: 5px; align-items: center;">
            <input type="text" id="site-title-input" placeholder="Web名を変更" style="padding:4px; font-size:12px; width:120px;">
            <button onclick="changeSiteTitle()" style="background:#ff9800; color:white; font-size:11px; padding:5px;">Web名変更</button>
            <button onclick="logout()" style="background: #f44336; color: white;">ログアウト</button>
        </div>
    </div>

    <div style="margin-bottom: 15px; background: #ddd; padding: 10px; border: 1px solid #999;">
        <b>ファイル操作:</b>
        <button onclick="saveToFile()" style="background: #4CAF50; color: white; margin-left: 10px; font-size: 14px; padding: 6px 12px;">💾 スタフをすべて保存</button>
        <label style="margin-left: 10px; cursor: pointer; background: #607D8B; color: white; padding: 6px 12px; display: inline-block; font-weight: bold; font-size: 14px;">
            📂 スタフ/Oudia読み込み (.json/.oud)
            <input type="file" id="file-loader" accept=".json,.oud" style="display: none;" onchange="loadFromFile(event)">
        </label>
    </div>

    <div class="container">
        <div class="control-panel">
            <h3>ダイヤ・スタフ編集 (無限追加可能)</h3>
            <button onclick="addTrain()" style="background: #4CAF50; color: white; width: 100%; margin-bottom: 15px; padding: 8px;">＋ 新しい列車を追加</button>
            
            <div id="trains-input-container"></div>
        </div>

        <div class="staff-cards-area" id="staff-preview-container"></div>
    </div>

    <script>
        let initialPasswords = [
            { name: "スタッフ01", pass: "834912" },
            { name: "スタッフ02", pass: "512064" },
            { name: "スタッフ03", pass: "948301" },
            { name: "スタッフ04", pass: "275619" },
            { name: "スタッフ05", pass: "630482" },
            { name: "スタッフ06", pass: "192547" },
            { name: "スタッフ07", pass: "481035" },
            { name: "スタッフ08", pass: "709283" },
            { name: "スタッフ09", pass: "356190" },
            { name: "スタッフ10", pass: "824716" },
            { name: "スタッフ11", pass: "503924" },
            { name: "スタッフ12", pass: "168430" },
            { name: "スタッフ13", pass: "912657" },
            { name: "スタッフ14", pass: "247081" },
            { name: "スタッフ15", pass: "685193" },
            { name: "スタッフ16", pass: "309462" },
            { name: "スタッフ17", pass: "741528" },
            { name: "スタッフ18", pass: "528091" },
            { name: "スタッフ19", pass: "193465" },
            { name: "管理者メイン", pass: "860247" }
        ];

        let allowedPasswords = JSON.parse(localStorage.getItem('allowedPasswords')) || initialPasswords;
        let staffHistory = JSON.parse(localStorage.getItem('staffHistory')) || [];
        let customSiteTitle = localStorage.getItem('customSiteTitle') || "鉄道スタフ作成ツール";

        document.getElementById('app-title-display').innerText = customSiteTitle;
        document.getElementById('page-title').innerText = customSiteTitle;
        document.getElementById('site-title-input').value = customSiteTitle;

        function changeSiteTitle() {
            let newTitle = document.getElementById('site-title-input').value.trim();
            if (!newTitle) return;
            customSiteTitle = newTitle;
            localStorage.setItem('customSiteTitle', customSiteTitle);
            document.getElementById('app-title-display').innerText = customSiteTitle;
            document.getElementById('page-title').innerText = customSiteTitle;
            recordHistory(`Webリンク名を「${customSiteTitle}」に変更`);
            alert("Webリンク名（タイトル）を変更しました！");
        }

        let clientIp = "取得中...";
        let clientDevice = navigator.userAgent;
        let currentLoggedInUser = "";

        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { clientIp = data.ip; })
            .catch(() => { clientIp = "IP取得失敗 (ローカル等)"; });

        let trainsData = JSON.parse(localStorage.getItem('trainsData')) || [];

        function checkPassword() {
            let val = document.getElementById('pass-input').value.trim();
            let matched = allowedPasswords.find(item => item.pass === val);

            if (matched) {
                currentLoggedInUser = matched.name;
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';
                recordHistory(`ログイン成功 (${currentLoggedInUser})`);
            } else {
                document.getElementById('auth-error').innerText = 'パスワードが違います';
            }
        }

        function logout() {
            recordHistory(`ログアウト (${currentLoggedInUser})`);
            document.getElementById('pass-input').value = '';
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function openAdminModalFromAuth() {
            let p = prompt("管理者用パスワードを入力してください");
            if (p === "1289") {
                currentLoggedInUser = "管理者パネル経由";
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';
                
                renderAdminData();
                document.getElementById('admin-modal').style.display = 'flex';
                recordHistory("管理者パネルを開き、ログイン完了");
            } else if (p !== null) {
                alert("パスワードが違います");
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function recordHistory(actionType) {
            let now = new Date().toLocaleString();
            let historyText = `[${now}] IP: <b>${clientIp}</b> | 担当: ${currentLoggedInUser || '未ログイン'} | 操作: ${actionType}<br><span style="font-size:9px; color:#666;">端末: ${clientDevice}</span>`;
            staffHistory.unshift(historyText);
            if (staffHistory.length > 30) staffHistory.pop();
            localStorage.setItem('staffHistory', JSON.stringify(staffHistory));
        }

        function renderAdminData() {
            document.getElementById('ip-info-box').innerHTML = `
                特定されたアクセスIPアドレス: <b>${clientIp}</b><br>
                利用端末情報: <span style="font-size:10px; color:#444;">${clientDevice}</span>
            `;

            let pwdContainer = document.getElementById('password-list-container');
            pwdContainer.innerHTML = '';
            allowedPasswords.forEach((item, idx) => {
                pwdContainer.innerHTML += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; background: #f9f9f9; padding: 3px 6px; border: 1px solid #ddd;">
                        <span style="font-size: 11px;"><b>[${item.name}]</b> パスワード: ${item.pass}</span>
                        <button onclick="removePassword(${idx})" style="background: #ff6666; color:white; border:none; padding:1px 4px; font-size:10px;">削除</button>
                    </div>
                `;
            });

            let histContainer = document.getElementById('staff-history-container');
            if (staffHistory.length === 0) {
                histContainer.innerHTML = '履歴はありません';
            } else {
                histContainer.innerHTML = staffHistory.map(h => `<div style="border-bottom:1px solid #eee; padding:4px 0;">${h}</div>`).join('');
            }
        }

        function addPassword() {
            let nameVal = document.getElementById('new-name-input').value.trim();
            let passVal = document.getElementById('new-pass-input').value.trim();

            if (!nameVal || !passVal) {
                alert("社員名と6桁のパスワードを入力してください。");
                return;
            }

            allowedPasswords.push({ name: nameVal, pass: passVal });
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            
            document.getElementById('new-name-input').value = '';
            document.getElementById('new-pass-input').value = '';
            
            renderAdminData();
            alert("社員用パスワードを追加しました！");
        }

        function removePassword(idx) {
            if (allowedPasswords.length <= 1) {
                alert("最後のパスワードは削除できません。");
                return;
            }
            allowedPasswords.splice(idx, 1);
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            renderAdminData();
        }

        function saveToFile() {
            recordHistory("すべてのスタフデータをファイルに保存");
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trainsData, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "all_staff_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadFromFile(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            
            if (file.name.endsWith('.oud')) {
                reader.onload = function(e) {
                    try {
                        parseOudiaFile(e.target.result);
                        render();
                        recordHistory("Oudiaファイルからデータを読み込み");
                        alert("Oudiaファイルを正常に読み込みました！");
                    } catch(err) {
                        alert("Oudiaファイルの解析に失敗しました。");
                    }
                };
                reader.readAsText(file, 'Shift_JIS');
            } else {
                reader.onload = function(e) {
                    try {
                        trainsData = JSON.parse(e.target.result);
                        render();
                        recordHistory("ファイルからすべてのスタフデータを読み込み");
                        alert("ファイルを正常に読み込みました！");
                    } catch(err) {
                        alert("ファイルの読み込みに失敗しました。");
                    }
                };
                reader.readAsText(file);
            }
        }

        // 簡易Oudia(.oud)パーサー
        function parseOudiaFile(text) {
            let lines = text.split('\n');
            let currentTrain = null;
            let stationsList = [];
            let inStationSection = false;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('[Ekijouhou]')) {
                    // 駅情報セクションなど
                }
                if (line.startsWith('Ressha=')) {
                    if (currentTrain) trainsData.push(currentTrain);
                    currentTrain = { num: "列車", stations: [] };
                }
                if (line.startsWith('Ressyabangou=')) {
                    if (currentTrain) currentTrain.num = line.split('=')[1].replace(/"/g, '');
                }
            }
            if (currentTrain && currentTrain.stations.length > 0) {
                trainsData.push(currentTrain);
            }
            if (trainsData.length === 0) {
                // 万が一抽出できなかった場合のフォールバック
                trainsData.push({ num: "Oudia読込", stations: [{ name: "駅A", arr: "", dep: "1000", handle: "停車", track: "1" }] });
            }
        }

        function updateTrainNum(tIndex, value) {
            trainsData[tIndex].num = value;
            localStorage.setItem('trainsData', JSON.stringify(trainsData));
            updatePreview();
        }

        function updateData(tIndex, sIndex, field, value) {
            let st = trainsData[tIndex].stations[sIndex];
            st[field] = value;

            // 「通過」と入力されたら到着・出発を自動的に「レ」にする
            if (field === 'handle' && value === '通過') {
                st.arr = 'レ';
                st.dep = 'レ';
                // 対応する入力欄のDOMも直接書き換える
                let arrInput = document.getElementById(`arr_${tIndex}_${sIndex}`);
                let depInput = document.getElementById(`dep_${tIndex}_${sIndex}`);
                if (arrInput) arrInput.value = 'レ';
                if (depInput) depInput.value = 'レ';
            }

            localStorage.setItem('trainsData', JSON.stringify(trainsData));
            updatePreview();
        }

        function updatePreview() {
            const previewContainer = document.getElementById('staff-preview-container');
            previewContainer.innerHTML = '';

            trainsData.forEach((train) => {
                let cardDiv = document.createElement('div');
                cardDiv.className = 'staff-card';
                
                let tableRowsHtml = '';
                train.stations.forEach(st => {
                    tableRowsHtml += `
                        <tr>
                            <td>${st.name}</td>
                            <td>${st.arr !== "" ? st.arr : '-'}</td>
                            <td>${st.dep !== "" ? st.dep : '-'}</td>
                            <td>${st.handle}</td>
                            <td>${st.track}</td>
                        </tr>
                    `;
                });

                cardDiv.innerHTML = `
                    <table class="staff-header">
                        <tr>
                            <td colspan="2" style="text-align:center; font-weight:bold;">${train.num}</td>
                        </tr>
                        <tr>
                            <td colspan="2" style="height: 15px;"></td>
                        </tr>
                    </table>
                    <table class="staff-table">
                        <tr>
                            <th>駅名</th>
                            <th>到着</th>
                            <th>出発</th>
                            <th>扱い</th>
                            <th>番線</th>
                        </tr>
                        ${tableRowsHtml}
                    </table>
                `;
                previewContainer.appendChild(cardDiv);
            });
        }

        function render() {
            localStorage.setItem('trainsData', JSON.stringify(trainsData));

            const inputContainer = document.getElementById('trains-input-container');
            inputContainer.innerHTML = '';

            trainsData.forEach((train, tIndex) => {
                let trainDiv = document.createElement('div');
                trainDiv.className = 'train-form';
                
                let stationsHtml = '';
                train.stations.forEach((st, sIndex) => {
                    stationsHtml += `
                        <div class="station-row">
                            <input type="text" class="name" placeholder="駅名" value="${st.name}" oninput="updateData(${tIndex}, ${sIndex}, 'name', this.value)">
                            <input type="text" id="arr_${tIndex}_${sIndex}" class="time" placeholder="着" value="${st.arr}" oninput="updateData(${tIndex}, ${sIndex}, 'arr', this.value)">
                            <input type="text" id="dep_${tIndex}_${sIndex}" class="time" placeholder="発" value="${st.dep}" oninput="updateData(${tIndex}, ${sIndex}, 'dep', this.value)">
                            <input type="text" class="hnd" placeholder="扱" value="${st.handle}" oninput="updateData(${tIndex}, ${sIndex}, 'handle', this.value)">
                            <input type="text" class="trk" placeholder="番線" value="${st.track}" oninput="updateData(${tIndex}, ${sIndex}, 'track', this.value)">
                            <button onclick="removeStation(${tIndex}, ${sIndex})" style="background:#ff9999; border:none; padding:2px 4px; font-size:10px;">✕</button>
                        </div>
                    `;
                });

                trainDiv.innerHTML = `
                    <h4>列車 ${tIndex + 1}</h4>
                    <div style="margin-bottom: 5px; font-size:12px;">
                        列車番号: <input type="text" value="${train.num}" style="width:120px;" oninput="updateTrainNum(${tIndex}, this.value)">
                    </div>
                    <div style="font-size:12px; font-weight:bold; margin-top:5px;">駅・時刻 (無限追加可能):</div>
                    ${stationsHtml}
                    <button onclick="addStation(${tIndex})" style="margin-top:5px; background:#ddd; font-size:11px;">＋ 駅を追加</button>
                    <button onclick="duplicateTrain(${tIndex})" style="margin-top:5px; background:#2196F3; color:white; font-size:11px; margin-left:3px;">📋 列車を複製</button>
                    <button onclick="removeTrain(${tIndex})" style="margin-top:5px; background:#ff6666; color:white; float:right; font-size:11px;">列車を削除</button>
                    <div style="clear:both;"></div>
                `;
                inputContainer.appendChild(trainDiv);
            });

            updatePreview();
        }

        function addTrain() {
            trainsData.push({
                num: "",
                stations: []
            });
            recordHistory("列車を追加");
            render();
        }

        function duplicateTrain(tIndex) {
            let targetTrain = trainsData[tIndex];
            let clonedTrain = JSON.parse(JSON.stringify(targetTrain));
            clonedTrain.num = clonedTrain.num + "_2";

            trainsData.splice(tIndex + 1, 0, clonedTrain);
            recordHistory(`列車を複製 (${clonedTrain.num})`);
            render();
        }

        function removeTrain(tIndex) {
            trainsData.splice(tIndex, 1);
            recordHistory("列車を削除");
            render();
        }

        function addStation(tIndex) {
            trainsData[tIndex].stations.push({ name: "", arr: "", dep: "", handle: "", track: "" });
            recordHistory("駅を追加");
            render();
        }

        function removeStation(tIndex, sIndex) {
            trainsData[tIndex].stations.splice(sIndex, 1);
            recordHistory("駅を削除");
            render();
        }

        render();
    </script>

</body>
</html>
