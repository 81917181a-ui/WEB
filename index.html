<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>鉄道スタフ作成ツール</title>
    <style>
        body {
            font-family: monospace;
            background: #f0f0f0;
            padding: 20px;
        }
        /* 🔐 最初に開くパスワード認証画面 */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            text-align: center;
            width: 320px;
            position: relative;
            border: 2px solid #000;
        }
        .auth-box input {
            width: 80%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        .auth-admin-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* メイン画面 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border: 2px solid #000;
            width: 420px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
            max-height: 75vh;
            overflow-y: auto;
        }
        .train-form {
            border: 1px dashed #666;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .station-row {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
            align-items: center;
            font-size: 12px;
        }
        .station-row input {
            padding: 3px;
        }
        .station-row input.name { width: 80px; }
        .station-row input.time { width: 55px; text-align: center; }
        .station-row input.hnd { width: 45px; text-align: center; }
        
        /* スタフの見た目 */
        .staff-cards-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .staff-card {
            background: white;
            border: 2px solid #000;
            width: 300px;
            padding: 10px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
        }
        .staff-header, .staff-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            margin-bottom: 5px;
        }
        .staff-header td, .staff-table th, .staff-table td {
            border: 1px solid #000;
            padding: 4px;
            font-size: 13px;
            text-align: center;
        }
        .staff-table th {
            background: #e0e0e0;
        }
        button {
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }
        /* 管理者パネルモーダル */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 8888;
        }
        .modal-content {
            background: white;
            padding: 20px;
            width: 500px;
            border: 2px solid #000;
            max-height: 85vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- 🔐 最初に開くパスワード認証画面 -->
    <div id="auth-screen">
        <div class="auth-box">
            <button class="auth-admin-btn" onclick="openAdminModalFromAuth()">管理者パネル</button>

            <h3>パスワード認証</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">社員用パスワードを入力してください</p>
            <input type="password" id="pass-input" placeholder="パスワード">
            <br>
            <button onclick="checkPassword()" style="background: #4CAF50; color: white; width: 85%; padding: 8px; border:none; border-radius:3px;">ログイン</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 🛠️ 管理者パネルモーダル -->
    <div id="admin-modal">
        <div class="modal-content">
            <h3>管理者パネル</h3>
            
            <h4 style="margin-bottom:5px;">🌐 機械側で特定したアクセス情報</h4>
            <div id="ip-info-box" style="background:#eee; padding:8px; font-size:12px; margin-bottom:15px; border:1px solid #ccc;">
                自動取得中...
            </div>

            <h4 style="margin-bottom:5px;">📋 社員用パスワード管理</h4>
            <div id="password-list-container" style="margin-bottom: 10px;"></div>
            <div style="margin-bottom: 15px; background: #fafafa; padding: 8px; border: 1px dashed #999;">
                <input type="text" id="new-name-input" placeholder="社員名/ニックネーム (例: スタッフA)" style="width: 45%; padding: 4px; margin-bottom: 4px;">
                <input type="text" id="new-pass-input" placeholder="パスワード" style="width: 45%; padding: 4px; margin-bottom: 4px;">
                <br>
                <button onclick="addPassword()" style="background: #2196F3; color: white; width: 100%; padding: 5px; font-size:12px;">社員用パスワードを追加</button>
            </div>

            <h4 style="margin-bottom:5px;">📁 操作履歴・アクセスログ（IP・端末情報自動記録）</h4>
            <div id="staff-history-container" style="background:#fefefe; padding:8px; font-size:11px; max-height:160px; overflow-y:auto; border:1px solid #ccc; margin-bottom: 15px;">
                履歴はありません
            </div>
            
            <button onclick="closeAdminModal()" style="width: 100%; background: #ccc; padding: 6px;">閉じる</button>
        </div>
    </div>

    <!-- メイン画面 -->
    <div class="top-bar">
        <h2>鉄道スタフ作成ツール (<span id="login-user-name" style="color:#2196F3; font-size:14px;"></span>)</h2>
        <div>
            <button onclick="logout()" style="background: #f44336; color: white; margin-right: 5px;">ログアウト</button>
        </div>
    </div>

    <!-- ファイル入出力バー -->
    <div style="margin-bottom: 15px; background: #ddd; padding: 10px; border: 1px solid #999;">
        <b>ファイル操作:</b>
        <button onclick="saveToFile()" style="background: #607D8B; color: white; margin-left: 10px;">💾 データをファイルに保存</button>
        <label style="margin-left: 10px; cursor: pointer; background: #607D8B; color: white; padding: 5px 10px; display: inline-block; font-weight: bold;">
            📂 ファイルから読み込み
            <input type="file" id="file-loader" accept=".json" style="display: none;" onchange="loadFromFile(event)">
        </label>
    </div>

    <div class="container">
        <!-- 入力パネル -->
        <div class="control-panel">
            <h3>ダイヤ編集</h3>
            <button onclick="addTrain()" style="background: #4CAF50; color: white; width: 100%; margin-bottom: 15px; padding: 8px;">＋ 新しい列車を追加</button>
            
            <div id="trains-input-container"></div>
        </div>

        <!-- プレビュー（スタフ表が並ぶ場所） -->
        <div class="staff-cards-area" id="staff-preview-container"></div>
    </div>

    <script>
        let allowedPasswords = JSON.parse(localStorage.getItem('allowedPasswords')) || [
            { name: "メイン管理者", pass: "3456" }
        ];

        let staffHistory = JSON.parse(localStorage.getItem('staffHistory')) || [];

        let clientIp = "取得中...";
        let clientDevice = navigator.userAgent;
        let currentLoggedInUser = "";

        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { clientIp = data.ip; })
            .catch(() => { clientIp = "IP取得失敗 (ローカル等)"; });

        let trainsData = JSON.parse(localStorage.getItem('trainsData')) || [
            {
                type: "普通",
                num: "1201",
                stations: [
                    { name: "終わり", arr: "", dep: "619", handle: "停車", track: "1番線" },
                    { name: "終わり東", arr: "レ", dep: "レ", handle: "通過", track: "1番線" },
                    { name: "終わり三丁目", arr: "632", dep: "633", handle: "停車", track: "1番線" }
                ]
            }
        ];

        function checkPassword() {
            let val = document.getElementById('pass-input').value.trim();
            let matched = allowedPasswords.find(item => item.pass === val);

            if (matched) {
                currentLoggedInUser = matched.name;
                document.getElementById('login-user-name').innerText = `ログイン者: ${currentLoggedInUser}`;
                document.getElementById('auth-screen').style.display = 'none';
                recordHistory(`ログイン成功 (${currentLoggedInUser})`);
            } else {
                document.getElementById('auth-error').innerText = 'パスワードが違います';
            }
        }

        function logout() {
            recordHistory(`ログアウト (${currentLoggedInUser})`);
            document.getElementById('pass-input').value = '';
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function openAdminModalFromAuth() {
            let p = prompt("管理者パスワードを入力してください (初期: 3456)");
            if (p === "3456") {
                renderAdminData();
                document.getElementById('admin-modal').style.display = 'flex';
                recordHistory("管理者パネルを開いた");
            } else if (p !== null) {
                alert("パスワードが違います");
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function recordHistory(actionType) {
            let now = new Date().toLocaleString();
            let historyText = `[${now}] IP: <b>${clientIp}</b> | 担当: ${currentLoggedInUser || '未ログイン'} | 操作: ${actionType}<br><span style="font-size:9px; color:#666;">端末: ${clientDevice}</span>`;
            staffHistory.unshift(historyText);
            if (staffHistory.length > 30) staffHistory.pop();
            localStorage.setItem('staffHistory', JSON.stringify(staffHistory));
        }

        function renderAdminData() {
            document.getElementById('ip-info-box').innerHTML = `
                特定されたアクセスIPアドレス: <b>${clientIp}</b><br>
                利用端末情報: <span style="font-size:10px; color:#444;">${clientDevice}</span>
            `;

            let pwdContainer = document.getElementById('password-list-container');
            pwdContainer.innerHTML = '';
            allowedPasswords.forEach((item, idx) => {
                pwdContainer.innerHTML += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; background: #f9f9f9; padding: 3px 6px; border: 1px solid #ddd;">
                        <span style="font-size: 11px;"><b>[${item.name}]</b> パスワード: ${item.pass}</span>
                        <button onclick="removePassword(${idx})" style="background: #ff6666; color:white; border:none; padding:1px 4px; font-size:10px;">削除</button>
                    </div>
                `;
            });

            let histContainer = document.getElementById('staff-history-container');
            if (staffHistory.length === 0) {
                histContainer.innerHTML = '履歴はありません';
            } else {
                histContainer.innerHTML = staffHistory.map(h => `<div style="border-bottom:1px solid #eee; padding:4px 0;">${h}</div>`).join('');
            }
        }

        function addPassword() {
            let nameVal = document.getElementById('new-name-input').value.trim();
            let passVal = document.getElementById('new-pass-input').value.trim();

            if (!nameVal || !passVal) {
                alert("社員名とパスワードを入力してください。");
                return;
            }

            allowedPasswords.push({ name: nameVal, pass: passVal });
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            
            document.getElementById('new-name-input').value = '';
            document.getElementById('new-pass-input').value = '';
            
            renderAdminData();
            alert("社員用パスワードを追加しました！");
        }

        function removePassword(idx) {
            if (allowedPasswords.length <= 1) {
                alert("メイン管理者のパスワードは削除できません。");
                return;
            }
            allowedPasswords.splice(idx, 1);
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            renderAdminData();
        }

        function saveToFile() {
            recordHistory("スタフデータをファイルに保存");
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trainsData, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "dia_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadFromFile(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    trainsData = JSON.parse(e.target.result);
                    render();
                    recordHistory("ファイルからダイヤデータを読み込み");
                    alert("ファイルを正常に読み込みました！");
                } catch(err) {
                    alert("ファイルの読み込みに失敗しました。");
                }
            };
            reader.readAsText(file);
        }

        function render() {
            localStorage.setItem('trainsData', JSON.stringify(trainsData));

            const inputContainer = document.getElementById('trains-input-container');
            const previewContainer = document.getElementById('staff-preview-container');
            
            inputContainer.innerHTML = '';
            previewContainer.innerHTML = '';

            trainsData.forEach((train, tIndex) => {
                let trainDiv = document.createElement('div');
                trainDiv.className = 'train-form';
                
                let stationsHtml = '';
                train.stations.forEach((st, sIndex) => {
                    stationsHtml += `
                        <div class="station-row">
                            <input type="text" class="name" placeholder="駅名" value="${st.name}" oninput="updateData(${tIndex}, ${sIndex}, 'name', this.value)">
                            <input type="text" class="time" placeholder="着" value="${st.arr}" oninput="updateData(${tIndex}, ${sIndex}, 'arr', this.value)">
                            <input type="text" class="time" placeholder="発" value="${st.dep}" oninput="updateData(${tIndex}, ${sIndex}, 'dep', this.value)">
                            <input type="text" class="hnd" placeholder="扱" value="${st.handle}" oninput="updateData(${tIndex}, ${sIndex}, 'handle', this.value)">
                            <button onclick="removeStation(${tIndex}, ${sIndex})" style="background:#ff9999; border:none; padding:2px 5px;">✕</button>
                        </div>
                    `;
                });

                trainDiv.innerHTML = `
                    <h4>列車 ${tIndex + 1}</h4>
                    <div style="margin-bottom: 5px; font-size:12px;">
                        種別: <input type="text" value="${train.type}" style="width:50px;" oninput="updateTrainInfo(${tIndex}, 'type', this.value)">
                        番号: <input type="text" value="${train.num}" style="width:50px;" oninput="updateTrainInfo(${tIndex}, 'num', this.value)">
                    </div>
                    <div style="font-size:12px; font-weight:bold; margin-top:5px;">駅・時刻 (通過は「レ」):</div>
                    ${stationsHtml}
                    <button onclick="addStation(${tIndex})" style="margin-top:5px; background:#ddd; font-size:11px;">＋ 駅を追加</button>
                    <button onclick="duplicateTrain(${tIndex})" style="margin-top:5px; background:#2196F3; color:white; font-size:11px; margin-left:3px;">📋 列車を複製</button>
                    <button onclick="removeTrain(${tIndex})" style="margin-top:5px; background:#ff6666; color:white; float:right; font-size:11px;">列車を削除</button>
                    <div style="clear:both;"></div>
                `;
                inputContainer.appendChild(trainDiv);

                let cardDiv = document.createElement('div');
                cardDiv.className = 'staff-card';
                
                let tableRowsHtml = '';
                train.stations.forEach(st => {
                    tableRowsHtml += `
                        <tr>
                            <td>${st.name}</td>
                            <td>${st.arr !== "" ? st.arr : '-'}</td>
                            <td>${st.dep !== "" ? st.dep : '-'}</td>
                            <td>${st.handle}</td>
                            <td>${st.track}</td>
                        </tr>
                    `;
                });

                cardDiv.innerHTML = `
                    <table class="staff-header">
                        <tr>
                            <td style="width: 40%;">${train.type}</td>
                            <td style="width: 60%;">${train.num}</td>
                        </tr>
                        <tr>
                            <td colspan="2" style="height: 15px;"></td>
                        </tr>
                    </table>
                    <table class="staff-table">
                        <tr>
                            <th>駅名</th>
                            <th>到着</th>
                            <th>出発</th>
                            <th>扱い</th>
                            <th>番線</th>
                        </tr>
                        ${tableRowsHtml}
                    </table>
                `;
                previewContainer.appendChild(cardDiv);
            });
        }

        function updateTrainInfo(tIndex, field, value) {
            trainsData[tIndex][field] = value;
            render();
        }

        function updateData(tIndex, sIndex, field, value) {
            trainsData[tIndex].stations[sIndex][field] = value;
            render();
        }

        function addTrain() {
            trainsData.push({
                type: "普通",
                num: "120" + (trainsData.length + 1),
                stations: [
                    { name: "始発駅", arr: "", dep: "0000", handle: "停車", track: "1番線" },
                    { name: "終着駅", arr: "0010", dep: "", handle: "停車", track: "1番線" }
                ]
            });
            recordHistory("列車を追加");
            render();
        }

        // 🌟 指定した列車のデータ（種別・番号・全駅・時刻）をそのままコピーして追加する関数
        function duplicateTrain(tIndex) {
            let targetTrain = trainsData[tIndex];
            // データを深いコピー（複製）する
            let clonedTrain = JSON.parse(JSON.stringify(targetTrain));
            // 列車番号だけ少し変えておくと分かりやすいので末尾に「-copy」などをつけるか、そのままにするか。今回は番号末尾に「_2」を付与
            clonedTrain.num = clonedTrain.num + "_2";

            trainsData.splice(tIndex + 1, 0, clonedTrain); // 元の列車のすぐ後ろに挿入
            recordHistory(`列車を複製 (${clonedTrain.type} ${clonedTrain.num})`);
            render();
        }

        function removeTrain(tIndex) {
            trainsData.splice(tIndex, 1);
            recordHistory("列車を削除");
            render();
        }

        function addStation(tIndex) {
            trainsData[tIndex].stations.push({ name: "駅名", arr: "", dep: "", handle: "停車", track: "1番線" });
            recordHistory("駅を追加");
            render();
        }

        function removeStation(tIndex, sIndex) {
            trainsData[tIndex].stations.splice(sIndex, 1);
            recordHistory("駅を削除");
            render();
        }

        render();
    </script>

</body>
</html>
