<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄道スタフ作成ツール</title>
    <style>
        body {
            font-family: monospace;
            background: #f0f0f0;
            padding: 20px;
        }
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            text-align: center;
            width: 320px;
            position: relative;
            border: 2px solid #000;
        }
        .auth-box input {
            width: 80%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        .auth-admin-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border: 2px solid #000;
            width: 480px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
        }
        .train-form {
            border: 1px dashed #666;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .station-row {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
            align-items: center;
            font-size: 12px;
        }
        .station-row input {
            padding: 3px;
        }
        .station-row input.name { width: 75px; }
        .station-row input.time { width: 50px; text-align: center; }
        .station-row input.hnd { width: 45px; text-align: center; }
        .station-row input.trk { width: 45px; text-align: center; }
        
        .staff-cards-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .staff-card {
            background: white;
            border: 2px solid #000;
            width: 300px;
            padding: 10px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.2);
        }
        .staff-header, .staff-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            margin-bottom: 5px;
        }
        .staff-header td, .staff-table th, .staff-table td {
            border: 1px solid #000;
            padding: 4px;
            font-size: 13px;
            text-align: center;
        }
        .staff-table th {
            background: #e0e0e0;
        }
        button {
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 8888;
        }
        .modal-content {
            background: white;
            padding: 20px;
            width: 700px;
            border: 2px solid #000;
            max-height: 85vh;
            overflow-y: auto;
        }
        .log-box {
            background: #fcfcfc;
            padding: 8px;
            font-size: 11px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <button class="auth-admin-btn" onclick="openAdminModalFromAuth()">管理者パネル</button>
            <h3>パスワード認証</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">社員用パスワードを入力してください</p>
            <input type="password" id="pass-input" placeholder="6桁のパスワード" maxlength="6">
            <br>
            <button onclick="checkPassword()" style="background: #4CAF50; color: white; width: 85%; padding: 8px; border:none; border-radius:3px;">ログイン</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 管理者パネル -->
    <div id="admin-modal">
        <div class="modal-content">
            <h3>管理者パネル</h3>
            
            <h4 style="margin-bottom:5px;">🌐 現在のアクセス環境・IP</h4>
            <div id="ip-info-box" style="background:#eee; padding:8px; font-size:12px; margin-bottom:15px; border:1px solid #ccc;">取得中...</div>
            
            <h4 style="margin-bottom:5px;">📋 社員用パスワード・ニックネーム管理（編集可能）</h4>
            <div id="password-list-container" style="margin-bottom: 10px; max-height:150px; overflow-y:auto;"></div>
            <div style="margin-bottom: 15px; background: #fafafa; padding: 8px; border: 1px dashed #999;">
                <input type="text" id="new-name-input" placeholder="社員名/ニックネーム" style="width: 42%; padding: 4px;">
                <input type="text" id="new-pass-input" placeholder="6桁パス" maxlength="6" style="width: 42%; padding: 4px;">
                <br><button onclick="addPassword()" style="background: #2196F3; color: white; width: 100%; margin-top:5px; font-size:12px;">新規追加</button>
            </div>

            <h4 style="margin-bottom:3px; color:#333;">🔑 ログインログ</h4>
            <div id="login-log-container" class="log-box">ログイン履歴なし</div>

            <h4 style="margin-bottom:3px; color:#333;">✍️ 作成・変更ログ</h4>
            <div id="creation-log-container" class="log-box">作成履歴なし</div>

            <button onclick="closeAdminModal()" style="width: 100%; background: #ccc; padding: 6px;">閉じる</button>
        </div>
    </div>

    <div class="top-bar">
        <div>
            <h2>鉄道スタフ作成ツール <span id="login-user-name" style="color:#2196F3; font-size:14px; font-weight:normal; margin-left:10px;"></span></h2>
        </div>
        <div>
            <button onclick="logout()" style="background: #f44336; color: white;">ログアウト</button>
        </div>
    </div>

    <div id="main-editor-area">
        <div style="margin-bottom: 15px; background: #ddd; padding: 10px; border: 1px solid #999;">
            <b>ファイル操作:</b>
            <button onclick="saveToFile()" style="background: #4CAF50; color: white; margin-left: 10px; font-size: 14px; padding: 6px 12px;">💾 スタフをすべて保存</button>
            <label style="margin-left: 10px; cursor: pointer; background: #607D8B; color: white; padding: 6px 12px; display: inline-block; font-weight: bold; font-size: 14px;">
                📂 ファイル読込 (JSON・OuDia対応)
                <input type="file" id="file-loader" onchange="loadFromFile(event)">
            </label>
        </div>

        <div class="container">
            <div class="control-panel">
                <h3>ダイヤ・スタフ編集 (無限追加可能)</h3>
                <button onclick="addTrain()" style="background: #4CAF50; color: white; width: 100%; margin-bottom: 15px; padding: 8px;">＋ 新しい列車を追加</button>
                <div id="trains-input-container"></div>
            </div>

            <div class="staff-cards-area" id="staff-preview-container"></div>
        </div>
    </div>

    <script>
        let initialPasswords = [
            { name: "スタッフ01", pass: "834912" },
            { name: "スタッフ02", pass: "512064" },
            { name: "スタッフ03", pass: "948301" },
            { name: "スタッフ04", pass: "275619" },
            { name: "スタッフ05", pass: "630482" },
            { name: "スタッフ06", pass: "192547" },
            { name: "スタッフ07", pass: "481035" },
            { name: "スタッフ08", pass: "709283" },
            { name: "スタッフ09", pass: "356190" },
            { name: "スタッフ10", pass: "824716" },
            { name: "管理者メイン", pass: "860247" }
        ];

        let allowedPasswords = JSON.parse(localStorage.getItem('allowedPasswords')) || initialPasswords;
        let staffHistory = JSON.parse(localStorage.getItem('staffHistory')) || [];
        let loginLogs = JSON.parse(localStorage.getItem('loginLogs')) || [];
        let creationLogs = JSON.parse(localStorage.getItem('creationLogs')) || [];
        let trainsData = JSON.parse(localStorage.getItem('trainsData')) || [];

        let clientIp = "取得中...";
        let clientGeo = "取得中...";
        let currentLoggedInUser = "";
        let currentLoggedInPass = "";

        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                clientIp = data.ip || "不明";
                clientGeo = `${data.city || '不明'}, ${data.region || ''}, ${data.country_name || ''}`;
            })
            .catch(() => { clientIp = "ローカル"; clientGeo = "不明"; });

        function checkPassword() {
            let val = document.getElementById('pass-input').value.trim();
            let matched = allowedPasswords.find(item => item.pass === val);
            if (matched) {
                currentLoggedInUser = matched.name;
                currentLoggedInPass = matched.pass;
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';

                let now = new Date().toLocaleString();
                let logText = `[${now}] ニックネーム: ${currentLoggedInUser} (パス: ${val}) | IP: ${clientIp} | 場所: ${clientGeo}`;
                loginLogs.unshift(logText);
                if (loginLogs.length > 30) loginLogs.pop();
                localStorage.setItem('loginLogs', JSON.stringify(loginLogs));
            } else {
                document.getElementById('auth-error').innerText = 'パスワードが違います';
            }
        }

        function logout() {
            currentLoggedInUser = "";
            currentLoggedInPass = "";
            document.getElementById('pass-input').value = '';
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function openAdminModalFromAuth() {
            let p = prompt("管理者用パスワードを入力してください");
            if (p === "1289") {
                currentLoggedInUser = "管理者(特権)";
                currentLoggedInPass = "1289";
                document.getElementById('login-user-name').innerText = `(ログイン者: ${currentLoggedInUser})`;
                document.getElementById('auth-screen').style.display = 'none';
                renderAdminData();
                document.getElementById('admin-modal').style.display = 'flex';
            } else if (p !== null) {
                alert("パスワードが違います");
            }
        }
        function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }

        function renderAdminData() {
            document.getElementById('ip-info-box').innerHTML = `IP: <b>${clientIp}</b><br>場所/環境: ${clientGeo}`;
            let c = document.getElementById('password-list-container');
            c.innerHTML = allowedPasswords.map((item, idx) => `
                <div style="font-size:11px; margin-bottom:5px; display:flex; gap:5px; align-items:center;">
                    <input type="text" id="edit-name-${idx}" value="${item.name}" style="width:120px; padding:2px;">
                    <input type="text" id="edit-pass-${idx}" value="${item.pass}" style="width:90px; padding:2px;" maxlength="6">
                    <button onclick="updatePasswordItem(${idx})" style="font-size:10px; background:#4CAF50; color:white; padding:2px 6px;">更新</button>
                    <button onclick="deletePasswordItem(${idx})" style="font-size:10px; background:#f44336; color:white; padding:2px 6px;">削除</button>
                </div>
            `).join('');
            
            document.getElementById('login-log-container').innerHTML = loginLogs.join('\n') || 'ログイン履歴なし';
            document.getElementById('creation-log-container').innerHTML = creationLogs.join('\n') || '作成履歴なし';
        }

        function addPassword() {
            let name = document.getElementById('new-name-input').value.trim();
            let pass = document.getElementById('new-pass-input').value.trim();
            if(!name || !pass) return;
            allowedPasswords.push({name, pass});
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            renderAdminData();
        }

        function updatePasswordItem(idx) {
            let newName = document.getElementById(`edit-name-${idx}`).value.trim();
            let newPass = document.getElementById(`edit-pass-${idx}`).value.trim();
            if(!newName || !newPass) return;
            allowedPasswords[idx].name = newName;
            allowedPasswords[idx].pass = newPass;
            localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
            renderAdminData();
            alert("更新しました！");
        }

        function deletePasswordItem(idx) {
            if(confirm("削除しますか？")) {
                allowedPasswords.splice(idx, 1);
                localStorage.setItem('allowedPasswords', JSON.stringify(allowedPasswords));
                renderAdminData();
            }
        }

        function saveToFile() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trainsData, null, 2));
            let d = document.createElement('a');
            d.setAttribute("href", dataStr);
            d.setAttribute("download", "all_staff_data.json");
            d.click();
        }

        function loadFromFile(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let parsed = JSON.parse(e.target.result);
                    trainsData = Array.isArray(parsed) ? parsed : [parsed];
                    render();
                } catch(err) {
                    alert("ファイル解析に失敗しました");
                }
            };
            reader.readAsText(file);
        }

        function updateTrainNum(tIndex, val) {
            trainsData[tIndex].num = val;
            render();
        }

        function updateData(tIndex, sIndex, field, val) {
            trainsData[tIndex].stations[sIndex][field] = val;
            updatePreview();
        }

        function updatePreview() {
            const previewContainer = document.getElementById('staff-preview-container');
            previewContainer.innerHTML = '';
            trainsData.forEach((train) => {
                let rows = train.stations.map(st => `
                    <tr><td>${st.name}</td><td>${st.arr || '-'}</td><td>${st.dep || '-'}</td><td>${st.handle}</td><td>${st.track}</td></tr>
                `).join('');
                previewContainer.innerHTML += `
                    <div class="staff-card">
                        <table class="staff-header"><tr><td style="font-weight:bold;">${train.num}</td></tr></table>
                        <table class="staff-table"><tr><th>駅名</th><th>到着</th><th>出発</th><th>扱い</th><th>番線</th></tr>${rows}</table>
                    </div>
                `;
            });
        }

        function render() {
            localStorage.setItem('trainsData', JSON.stringify(trainsData));
            let container = document.getElementById('trains-input-container');
            container.innerHTML = '';
            trainsData.forEach((train, tIndex) => {
                let stHtml = train.stations.map((st, sIndex) => `
                    <div class="station-row">
                        <input type="text" class="name" value="${st.name}" oninput="updateData(${tIndex}, ${sIndex}, 'name', this.value)">
                        <input type="text" class="time" value="${st.arr}" oninput="updateData(${tIndex}, ${sIndex}, 'arr', this.value)">
                        <input type="text" class="time" value="${st.dep}" oninput="updateData(${tIndex}, ${sIndex}, 'dep', this.value)">
                        <input type="text" class="hnd" value="${st.handle}" oninput="updateData(${tIndex}, ${sIndex}, 'handle', this.value)">
                        <input type="text" class="trk" value="${st.track}" oninput="updateData(${tIndex}, ${sIndex}, 'track', this.value)">
                        <button onclick="removeStation(${tIndex}, ${sIndex})" style="background:#ff9999; border:none; padding:2px 4px; font-size:10px;">✕</button>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="train-form">
                        <h4>列車 ${tIndex + 1}</h4>
                        <div style="margin-bottom: 5px; font-size:12px;">列車番号: <input type="text" value="${train.num}" style="width:120px;" oninput="updateTrainNum(${tIndex}, this.value)"></div>
                        ${stHtml}
                        <button onclick="addStation(${tIndex})" style="background:#ddd; font-size:11px;">＋ 駅を追加</button>
                        <button onclick="removeTrain(${tIndex})" style="background:#ff6666; color:white; float:right; font-size:11px;">列車を削除</button>
                        <div style="clear:both;"></div>
                    </div>
                `;
            });
            updatePreview();
        }

        function addTrain() { trainsData.push({num: "新列車", stations: []}); render(); }
        function removeTrain(i) { trainsData.splice(i, 1); render(); }
        function addStation(t) { trainsData[t].stations.push({name:"", arr:"", dep:"", handle:"停車", track:""}); render(); }
        function removeStation(t, s) { trainsData[t].stations.splice(s, 1); render(); }

        render();
    </script>
</body>
</html>
